<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육 준비 점검표 | 지역아동센터 종사자 디지털 역량 강화 교육</title>
<meta name="description" content="회기마다 교육 전에 챙겨야 할 것을 하나씩 확인하는 준비 점검표입니다.">
<meta property="og:title" content="교육 준비 점검표">
<meta property="og:description" content="지역아동센터 종사자 디지털 역량 강화 교육, 회기별 준비 사항을 확인해 주세요.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#EEF3F1; --sheet:#FFFFFF; --ink:#18293A; --muted:#566878; --line:#D3DDE2; --chip:#F1F5F7;
  --s1:#2A5FC4; --s2:#0C8466; --s3:#A86A12; --stamp:#C4303A; --doing:#8A6A00; --on:#FFFFFF;
  --acc:var(--s1);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10171E; --sheet:#18212A; --ink:#E5ECF1; --muted:#98A8B5; --line:#2B3843; --chip:#212C36;
    --s1:#79A3F2; --s2:#43C29F; --s3:#E3AA52; --stamp:#F2656D; --doing:#E3C25A; --on:#10171E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10171E; --sheet:#18212A; --ink:#E5ECF1; --muted:#98A8B5; --line:#2B3843; --chip:#212C36;
  --s1:#79A3F2; --s2:#43C29F; --s3:#E3AA52; --stamp:#F2656D; --doing:#E3C25A; --on:#10171E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px}
h1,h2,h3{font-family:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(2rem,6vw,2.75rem);line-height:1.15}
h2{font-size:1.6rem;line-height:1.25}
h3{font-size:1.25rem;line-height:1.3}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.badge{display:inline-block;font-family:"IBM Plex Sans KR",sans-serif;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);vertical-align:middle;margin-left:6px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.top .lead{margin-top:8px;color:var(--muted);max-width:34em}
.who{text-align:right;font-size:.875rem;color:var(--muted);white-space:nowrap}
.who strong{color:var(--ink)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:end}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--chip);border-radius:12px 12px 0 0;padding:10px 12px 12px;text-align:left;position:relative;min-height:78px}
.tab .n{font-size:.8rem;color:var(--muted)}
.tab .t{display:block;font-family:"Do Hyeon",sans-serif;font-size:1.15rem;line-height:1.2}
.tab .st{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.tab::before{content:"";position:absolute;left:12px;right:12px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--tc)}
.tab[aria-selected="true"]{background:var(--sheet);padding-bottom:16px;z-index:1}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:0 0 14px 14px;margin-top:-1px;padding:24px 20px}
@media (min-width:640px){.sheet{padding:30px 32px}}

.info{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:16px 0 4px;font-size:.95rem}
.info dt{color:var(--muted)} .info dd{margin:0}
.intro{border-left:4px solid var(--acc);padding-left:14px}
.intro p{color:var(--muted);margin-top:4px}

.summary{display:flex;align-items:center;gap:20px;margin:22px 0 6px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.summary .big{font-family:"Do Hyeon",sans-serif;font-size:2.4rem;line-height:1}
.summary .track{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin-top:8px}
.summary .fill{height:100%;background:var(--acc);transition:width .25s}
.stamp{flex:none;width:104px;height:104px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;text-align:center;transform:rotate(-9deg);box-shadow:inset 0 0 0 3px var(--sheet),inset 0 0 0 5px var(--stamp);font-family:"Do Hyeon",sans-serif;font-size:1.45rem;line-height:1.1;animation:press .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes press{from{transform:rotate(-9deg) scale(1.5);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.summary .fill{transition:none}}

.group{margin-top:30px}
.group h3{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.group h3 .due{font-family:"IBM Plex Sans KR",sans-serif;font-size:.85rem;color:var(--muted)}
.group h3 .late{color:var(--stamp)}
.item{padding:16px 0;border-bottom:1px dashed var(--line)}
.item .q{font-weight:500}
.item .how{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.item .opt{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.status{display:flex;flex-wrap:wrap;gap:6px}
.status button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px 14px;font-size:.875rem;line-height:1.2}
.status button:hover{border-color:var(--acc)}
.status button[aria-checked="true"][data-v="done"]{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.status button[aria-checked="true"][data-v="doing"]{background:transparent;border:2px dashed var(--doing);color:var(--doing);font-weight:700;padding:7px 13px}
.status button[aria-checked="true"][data-v="help"]{background:var(--stamp);border-color:var(--stamp);color:var(--on);font-weight:700}
.status button[aria-checked="true"][data-v="na"]{background:var(--line);font-weight:700}
.helpnote{margin-top:10px}
.helpnote input{width:100%;padding:9px 12px;border:1px solid var(--stamp);border-radius:8px;background:var(--chip)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:10px 12px;resize:vertical}
label.block{display:block;font-weight:700;margin:30px 0 8px}
.saved{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:24px auto 0;width:max-content;max-width:100%;background:var(--ink);color:var(--sheet);font-size:.85rem;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.saved.show{opacity:1}
.saved.err{background:var(--stamp);opacity:1;pointer-events:auto}

.login{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
.login input{width:100%;font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--chip);margin:12px 0}
.login input:focus{border-color:var(--acc);outline:none}
.err{color:var(--stamp);font-size:.9rem;min-height:1.4em}
.hint{margin-top:14px;padding:12px 14px;background:var(--chip);border-radius:10px;font-size:.875rem;color:var(--muted)}
.btn{border:0;background:var(--ink);color:var(--sheet);border-radius:10px;padding:12px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.plan{margin-top:24px;display:grid;gap:10px}
.plan div{display:flex;gap:12px;align-items:baseline}
.plan b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:1.1rem;min-width:3.2em}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:560px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
thead th{color:var(--muted);border-bottom:2px solid var(--ink)}
.adminsec{margin-top:32px}
.req{border-left:3px solid var(--stamp);padding:6px 0 6px 12px;margin:10px 0;font-size:.925rem}
.req .meta{font-size:.8rem;color:var(--muted)}
.codes{font-size:.85rem;color:var(--muted);word-break:keep-all;line-height:1.9}
.codes span{display:inline-block;background:var(--chip);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.form-row{display:grid;gap:8px;margin:10px 0}
.form-row input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--chip)}
footer{margin-top:40px;font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:9;display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   1. 설정 — Supabase 값을 넣으면 실서비스, 비우면 미리보기 모드
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: "",
  COURSE_NAME: "지역아동센터 종사자 디지털 역량 강화 교육",
  // ▼ 확정 교육일. 시간(time)이 정해지면 채워 넣으세요. 비워 두면 '시간 추후 안내'로 표시됩니다.
  SCHEDULE: {
    seoul:   { 1: { date: "2026-10-15", time: "" }, 2: { date: "2026-10-22", time: "" }, 3: { date: "2026-10-29", time: "" } },
    daejeon: { 1: { date: "2026-10-14", time: "" }, 2: { date: "2026-10-21", time: "" }, 3: { date: "2026-10-28", time: "" } }
  },
  // ▼ 지역별 교육장. room(강의실)이 정해지면 채워 넣으세요.
  VENUES: {
    seoul:   { name: "ICT콤플렉스", address: "서울 마포구 마포대로 122 프론트원 6층", room: "",
               note: "주차가 어려우니 대중교통을 이용해 주세요.", link: "https://www.ictcoc.kr/news/news.asp" },
    daejeon: { name: "예람인재교육센터", address: "대전 중구 계룡로 814 예람빌딩", room: "",
               note: "주차장이 매우 좁으니 대중교통을 이용해 주세요.", link: "" }
  },
  // 준비 기한이 주말·공휴일이면 직전 평일로 당깁니다.
  HOLIDAYS: ["2026-10-03", "2026-10-05", "2026-10-09"]
};
const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
const sb = LIVE ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

/* =========================================================
   2. 준비 점검 항목 (id는 집계 키 — 배포 후 변경 금지)
   when: d14=2주 전, d7=1주 전, d1=전날, d0=당일 / optional: '해당 없음' 선택 가능
   ========================================================= */
const WHEN = [
  { key: "d14", label: "2주 전까지", offset: 14 },
  { key: "d7",  label: "1주 전까지", offset: 7 },
  { key: "d3",  label: "3일 전까지", offset: 3 },
  { key: "d1",  label: "교육 전날까지", offset: 1 },
  { key: "d0",  label: "교육 당일 챙길 것", offset: 0 }
];
const STATUS = [
  { v: "done",  label: "완료" },
  { v: "doing", label: "준비 중" },
  { v: "help",  label: "도움 필요" },
  { v: "na",    label: "해당 없음" }
];

const SESSIONS = [
{
  id: 1, color: "--s1", title: "스마트워크 도입과 활용", short: "스마트워크",
  intro: "비영리 인증을 받은 기관 계정으로 실습합니다. 인증 심사에 시간이 걸리므로 서류 준비를 가장 먼저 해 주세요.",
  items: [
    { id: "1-01", when: "d14", text: "우리 센터의 운영 형태(법인 운영 또는 개인 운영)와 고유번호증 보유 여부를 확인했다.", how: "비영리 인증은 고유번호증이나 비영리법인 증빙서류를 기준으로 심사합니다. 센터장님께 확인하고, 없거나 확실하지 않으면 '도움 필요'를 눌러 주세요." },
    { id: "1-02", when: "d14", text: "고유번호증(또는 비영리법인 증빙서류)을 스캔해 PDF로 준비했다.", how: "글자가 잘리지 않게 전체를 스캔하세요. 대표자와 주소가 지금과 같은지도 확인해 주세요. 달라졌다면 '도움 필요'로 알려 주세요." },
    { id: "1-03", when: "d14", text: "지역아동센터 신고증을 스캔해 PDF로 준비했다.", how: "기관이 실제로 운영되고 있음을 보여 주는 보조 서류로 씁니다." },
    { id: "1-04", when: "d14", text: "우리 센터가 구글 또는 마이크로소프트 비영리 인증을 이미 받았는지 확인했다.", how: "센터장님이나 전임자에게 '구글 비영리' 또는 '마이크로소프트 비영리'로 가입한 적이 있는지 물어보세요. 이미 받았다면 새로 신청하지 않고 기존 계정으로 실습합니다." },
    { id: "1-05", when: "d14", text: "교육 참여와 기관 명의 계정 신청에 대해 센터장님께 동의를 받았다.", how: "인증은 기관 명의로 신청합니다. 심사 과정에서 대표자 확인이 필요할 수 있습니다." },
    { id: "1-06", when: "d7", optional: true, text: "이미 인증을 받은 센터라면, 관리자 계정의 아이디와 비밀번호를 확인했다.", how: "인증을 받은 적이 없다면 '해당 없음'을 고르세요. 관리자 계정을 누가 갖고 있는지 모르면 '도움 필요'를 눌러 주세요." },
    { id: "1-07", when: "d7", text: "인증 심사 연락을 받을 기관 공식 이메일과 대표 전화번호를 정리했다.", how: "심사 중 확인 메일이나 전화가 올 수 있습니다. 담당자 개인 이메일보다 기관 이메일을 권합니다." },
    { id: "1-08", when: "d7", optional: true, text: "센터 홈페이지, 블로그, SNS처럼 기관을 소개하는 온라인 주소를 정리했다.", how: "신청서에 기관 웹사이트를 적는 칸이 있습니다. 온라인 주소가 없어도 신청할 수 있으니 없으면 '해당 없음'을 고르세요." },
    { id: "1-09", when: "d7", text: "기관 전용 인터넷 주소(도메인)가 있는지 확인했다.", how: "'○○센터.kr'처럼 기관 주소가 있으면 기관 계정을 만들기 쉽습니다. 없다는 것을 확인했다면 '완료'를 고르세요. 교육에서 방법을 안내합니다." },
    { id: "1-10", when: "d1", text: "온라인으로 바꿔 보고 싶은 센터 업무 한 가지를 정했다.", how: "차량 일정 공유, 출결 취합, 프로그램 신청 받기처럼 매주 반복되는 일을 골라 오세요. 실습 주제로 씁니다." },
    { id: "1-11", when: "d1", text: "노트북에 크롬 브라우저를 설치하고, 실습에 쓸 구글 계정으로 로그인해 보았다.", how: "비밀번호를 몰라서 실습 시간을 놓치는 경우가 가장 많습니다. 전날 한 번 로그인해 두세요." },
    { id: "1-12", when: "d0", text: "노트북과 충전기를 챙겼다.", how: "스마트폰만으로는 실습이 어렵습니다. 노트북이 없으면 미리 '도움 필요'로 알려 주세요." },
    { id: "1-13", when: "d0", text: "인증번호를 받을 휴대폰을 챙겼다.", how: "계정 로그인과 2단계 인증 설정에 인증번호가 필요합니다." },
    { id: "1-14", when: "d0", text: "준비한 서류 PDF를 노트북이나 클라우드에서 바로 열 수 있게 두었다.", how: "교육 중에 인증 신청 단계를 바로 진행합니다." }
  ]
},
{
  id: 2, color: "--s2", title: "인공지능 활용", short: "AI 활용",

const allItems = SESSIONS.flatMap(s => s.items);
const findItem = id => allItems.find(i => i.id === id);
const regionName = r => r === "seoul" ? "서울" : r === "daejeon" ? "대전" : r;
const WD = ["일", "월", "화", "수", "목", "금", "토"];

/* =========================================================
   3. 저장소와 API
   ========================================================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const DEMO_KEY = "prepcheck-demo-v1";

const api = {
  async checkCode(raw) {
    const code = String(raw || "").trim().toUpperCase();
    if (LIVE) {
      const { data, error } = await sb.rpc("check_code", { p_code: code });
      if (error) throw error;
      return data && data[0] ? data[0] : null;
    }
    const m = /^(SE|DJ)-[A-Z0-9]{4}$/.exec(code);
    return m ? { code, region: m[1] === "SE" ? "seoul" : "daejeon" } : null;
  },
  async myPrep(code) {
    if (LIVE) {
      const { data, error } = await sb.rpc("get_my_prep", { p_code: code });
      if (error) throw error;
      return data || [];
    }
    return store.get(DEMO_KEY, []).filter(r => r.participant_code === code);
  },
  async save(code, session, items, notes, question) {
    if (LIVE) {
      const { error } = await sb.rpc("save_prep", { p_code: code, p_session: session, p_items: items, p_notes: notes, p_question: question || null });
      if (error) throw error;
      return;
    }
    const all = store.get(DEMO_KEY, []).filter(r => !(r.participant_code === code && r.session === session));
    all.push({ participant_code: code, region: code.startsWith("SE") ? "seoul" : "daejeon", session, items, notes, question, updated_at: new Date().toISOString() });
    store.set(DEMO_KEY, all);
  },
  async adminLogin(email, password) {
    if (!LIVE) return;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
  },
  async adminSession() { if (!LIVE) return true; const { data } = await sb.auth.getSession(); return !!(data && data.session); },
  async adminLogout() { if (LIVE) await sb.auth.signOut(); },
  async adminData() {
    if (LIVE) {
      const [p, r] = await Promise.all([
        sb.from("participants").select("code,region").limit(1000),
        sb.from("prep_status").select("participant_code,session,items,notes,question,updated_at,participants(region)").limit(2000)
      ]);
      if (p.error) throw p.error; if (r.error) throw r.error;
      return { participants: p.data, rows: r.data.map(x => ({ ...x, region: x.participants ? x.participants.region : "" })) };
    }
    return demoDataset();
  }
};

/* 미리보기용 가상 데이터: 서울 30명, 대전 30명 */
function demoDataset() {
  let seed = 7171;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const helpNotes = { "1-01": "개인 운영 센터인데 고유번호증이 있는지 모르겠습니다.", "1-02": "대표자가 바뀌었는데 고유번호증은 예전 그대로입니다.", "1-06": "전임자가 퇴사해서 관리자 비밀번호를 모릅니다.", "1-12": "센터 노트북이 한 대뿐이라 가져가기 어렵습니다.", "2-01": "보완 서류를 요청받았는데 무엇을 내야 할지 모르겠어요.", "2-02": "휴대폰 인증 단계에서 계속 오류가 납니다.", "3-01": "사진 활용 동의서 양식이 따로 없습니다." };
  const qs = ["교육장에 주차가 가능한가요?", "센터장님도 함께 들어도 되나요?", "태블릿으로도 실습할 수 있나요?"];
  const participants = [], rows = [];
  ["seoul", "daejeon"].forEach((region, ri) => {
    for (let n = 1; n <= 30; n++) {
      const code = (ri ? "DJ-" : "SE-") + String(n).padStart(4, "0");
      participants.push({ code, region });
      SESSIONS.forEach(s => {
        const answerRate = s.id === 1 ? 0.9 : s.id === 2 ? 0.7 : 0.45;
        if (rnd() > answerRate) return;
        const items = {}, notes = {};
        s.items.forEach(it => {
          const r = rnd();
          if (it.optional && r < 0.25) items[it.id] = "na";
          else if (r < 0.62 - (it.when === "d0" ? 0.25 : 0)) items[it.id] = "done";
          else if (r < 0.86) items[it.id] = "doing";
          else if (r > 0.94 && (helpNotes[it.id] || r > 0.985)) { items[it.id] = "help"; if (helpNotes[it.id] && rnd() < 0.7) notes[it.id] = helpNotes[it.id]; }
        });
        rows.push({ participant_code: code, region, session: s.id, items, notes, question: rnd() < 0.08 ? qs[Math.floor(rnd() * qs.length)] : null, updated_at: new Date(Date.now() - rnd() * 6e8).toISOString() });
      });
    }
  });
  const mine = store.get(DEMO_KEY, []);
  mine.forEach(m => { if (!participants.some(p => p.code === m.participant_code)) participants.push({ code: m.participant_code, region: m.region }); });
  return { participants, rows: rows.concat(mine) };
}

/* =========================================================
   4. 계산
   ========================================================= */
function readiness(session, items) {
  const target = session.items.filter(i => items[i.id] !== "na");
  const done = target.filter(i => items[i.id] === "done").length;
  return { done, total: target.length, pct: target.length ? Math.round(done / target.length * 100) : 0,
           help: session.items.filter(i => items[i.id] === "help").length,
           touched: Object.keys(items).length };
}
function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function fmt(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일(${WD[d.getDay()]})`; }
function today0() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function schedFor(region, sid) { return (CONFIG.SCHEDULE[region] || {})[sid] || null; }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function dueDate(region, sid, offset) {
  const sc = schedFor(region, sid); const d = sc && parseDate(sc.date); if (!d) return null;
  const x = new Date(d); x.setDate(x.getDate() - offset);
  if (offset > 0) while (x.getDay() === 0 || x.getDay() === 6 || (CONFIG.HOLIDAYS || []).includes(ymd(x))) x.setDate(x.getDate() - 1);
  return x;
}

function venueHtml(region) {
  const v = (CONFIG.VENUES || {})[region];
  if (!v) return `<dt>장소</dt><dd><span class="muted">추후 안내</span></dd>`;
  const map = "https://map.naver.com/p/search/" + encodeURIComponent(v.address.replace(/\s\d+층$/, ""));
  return `<dt>장소</dt><dd><b>${esc(v.name)}</b>${v.room ? " " + esc(v.room) : ""}<br>
    <span class="small">${esc(v.address)}</span>
    <br><span class="small"><a href="${map}" target="_blank" rel="noopener" style="color:var(--acc)">지도 보기</a>${v.link ? `&nbsp;&nbsp;<a href="${esc(v.link)}" target="_blank" rel="noopener" style="color:var(--acc)">교육장 안내</a>` : ""}</span>
    ${v.note ? `<br><span class="small muted">${esc(v.note)}</span>` : ""}</dd>`;
}

/* =========================================================
   5. 참가자 화면

const state = { user: null, session: 1, prep: {} };
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 2600); }
function setAccent(sid) { document.documentElement.style.setProperty("--acc", `var(${SESSIONS[sid - 1].color})`); }
const prepOf = sid => state.prep[sid] || (state.prep[sid] = { items: {}, notes: {}, question: "" });

  };

async function enter(u) {
  state.user = u; store.set("prepcheck-code", u.code);
  const rows = await api.myPrep(u.code);
  state.prep = {};
  rows.forEach(r => state.prep[r.session] = { items: r.items || {}, notes: r.notes || {}, question: r.question || "" });
  const sp = new URLSearchParams(location.search);
  const s = Number(sp.get("s"));
  if (s >= 1 && s <= 3) state.session = s;
  else {
    const t = today0();
    const next = SESSIONS.find(x => { const d = parseDate((schedFor(u.region, x.id) || {}).date); return d && d >= t; });
    state.session = next ? next.id : 1;
  }
  renderMain();
}

function tabStatus(s) {
  const p = state.prep[s.id]; if (!p || !Object.keys(p.items).length) return "시작 전";
  const r = readiness(s, p.items);
  return r.pct === 100 ? "준비 완료" : `${r.pct}% 준비` + (r.help ? `, 도움 ${r.help}` : "");
}

      <div class="saved" id="saved" role="status" aria-live="polite"></div>
    </section>`;
  document.getElementById("lo").onclick = () => { store.del("prepcheck-code"); state.user = null; renderLogin(); };
  $app.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.session = Number(b.dataset.s); renderMain(); });
  renderGroups(s); renderSummary(s);

function renderSummary(s) {
  const r = readiness(s, prepOf(s.id).items);
  const el = document.getElementById("sum");
  el.innerHTML = `<div class="summary">
    ${r.pct === 100 ? `<div class="stamp">준비<br>완료</div>` : ""}
    <div style="flex:1">
      <div><span class="big">${r.done}</span> <span class="muted">/ ${r.total}가지 완료</span></div>
      <div class="track"><div class="fill" style="width:${r.pct}%"></div></div>
      <p class="small muted" style="margin-top:8px">${r.pct === 100 ? "모든 준비를 마쳤습니다. 교육 날 뵙겠습니다." : r.help ? `도움 요청 ${r.help}건이 운영진에게 전달됩니다.` : "하나씩 고를 때마다 자동으로 저장됩니다."}</p>
    </div></div>`;
  const tab = $app.querySelector(`.tab[data-s="${s.id}"] .st`); if (tab) tab.textContent = tabStatus(s);
}

function renderGroups(s) {
  const p = prepOf(s.id), t = today0();
  document.getElementById("groups").innerHTML = WHEN.map(w => {
    const its = s.items.filter(i => i.when === w.key); if (!its.length) return "";
    const due = dueDate(state.user.region, s.id, w.offset);
    const late = due && due < t && its.some(i => !["done", "na"].includes(p.items[i.id]));
    return `<div class="group"><h3>${w.label}${due ? `<span class="due ${late ? "late" : ""}">${fmt(due)}${late ? " 지났습니다" : ""}</span>` : ""}</h3>
      ${its.map(it => {
        const v = p.items[it.id];
        return `<div class="item" id="it-${it.id}">
          <p class="q" id="q-${it.id}">${esc(it.text)}${it.optional ? `<span class="opt">선택</span>` : ""}</p>
          <p class="how">${esc(it.how)}</p>
          <div class="status" role="radiogroup" aria-labelledby="q-${it.id}">
            ${STATUS.filter(o => o.v !== "na" || it.optional).map(o => `<button type="button" role="radio" data-i="${it.id}" data-v="${o.v}" aria-checked="${v === o.v}">${o.label}</button>`).join("")}
          </div>
          ${v === "help" ? `<div class="helpnote"><input data-note="${it.id}" maxlength="200" placeholder="어떤 도움이 필요한지 한 줄로 적어 주세요" value="${esc(p.notes[it.id] || "")}" aria-label="필요한 도움"></div>` : ""}
        </div>`;
      }).join("")}</div>`;
  }).join("");
  document.querySelectorAll(".status button").forEach(b => b.onclick = () => {
    const id = b.dataset.i, v = b.dataset.v;
    if (p.items[id] === v) delete p.items[id]; else p.items[id] = v;
    if (p.items[id] !== "help") delete p.notes[id];
    const y = b.getBoundingClientRect().top;
    renderGroups(s); renderSummary(s);
    const nb = document.querySelector(`#it-${id} .status button[data-v="${v}"]`);
    if (nb) { window.scrollBy(0, nb.getBoundingClientRect().top - y); nb.focus({ preventScroll: true }); }
    if (p.items[id] === "help") { const inp = document.querySelector(`[data-note="${id}"]`); if (inp) inp.focus({ preventScroll: true }); }
    queueSave(s.id, 500);
  });
  document.querySelectorAll("[data-note]").forEach(inp => inp.oninput = () => { p.notes[inp.dataset.note] = inp.value; queueSave(s.id, 1200); });
}

let saveTimer = null;
function queueSave(sid, delay) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => doSave(sid), delay);
}
async function doSave(sid) {
  const p = prepOf(sid), el = document.getElementById("saved");
  const notes = {}; Object.entries(p.notes).forEach(([k, v]) => { if (v && v.trim()) notes[k] = v.trim(); });
  try {
    await api.save(state.user.code, sid, p.items, notes, (p.question || "").trim());
    if (el) { el.className = "saved show"; el.textContent = "저장했습니다"; clearTimeout(doSave._t); doSave._t = setTimeout(() => el.className = "saved", 1600); }
  } catch (ex) {
    console.error(ex);
    if (el) { el.className = "saved err"; el.innerHTML = `저장하지 못했습니다. <button class="linkbtn" style="color:inherit" id="retry">다시 저장</button>`; document.getElementById("retry").onclick = () => doSave(sid); }
  }
}

/* =========================================================
   6. 운영자 화면
   ========================================================= */
async function renderAdmin() {
  setAccent(1);
  if (!(await api.adminSession())) {
    $app.innerHTML = `
      <header class="top"><div><p class="muted small">${esc(CONFIG.COURSE_NAME)}</p><h1>운영자 화면</h1></div></header>
      <section class="login"><h2>운영자 로그인</h2>
        <form id="af"><div class="form-row"><input id="ae" type="email" placeholder="이메일" required><input id="ap" type="password" placeholder="비밀번호" required></div>
        <div class="err" id="aerr"></div><button class="btn" style="width:100%">로그인</button></form></section>
      <footer><button class="linkbtn" id="back">참가자 화면으로</button></footer>`;
    document.getElementById("af").onsubmit = async e => {
      e.preventDefault();
      try { await api.adminLogin(document.getElementById("ae").value, document.getElementById("ap").value); renderAdmin(); }
      catch (ex) { document.getElementById("aerr").textContent = "로그인하지 못했습니다. 이메일과 비밀번호를 확인하세요."; }
    };
    document.getElementById("back").onclick = () => { location.hash = ""; };
    return;
  }
  $app.innerHTML = `<p class="muted">불러오는 중…</p>`;
  let data;
  try { data = await api.adminData(); }
  catch (ex) { console.error(ex); $app.innerHTML = `<p class="err">자료를 불러오지 못했습니다. 이 계정이 admins 테이블에 등록되어 있는지 확인하세요.</p>`; return; }
  const { participants, rows } = data;

  const stats = [];
  ["seoul", "daejeon"].forEach(reg => SESSIONS.forEach(s => {
    const ps = participants.filter(p => p.region === reg);
    const rs = rows.filter(r => r.region === reg && r.session === s.id && Object.keys(r.items || {}).length);
    const rd = rs.map(r => readiness(s, r.items));
    stats.push({ reg, s, total: ps.length, answered: rs.length,
      avg: rd.length ? Math.round(rd.reduce((a, b) => a + b.pct, 0) / rd.length) : null,
      full: rd.filter(x => x.pct === 100).length, help: rd.reduce((a, b) => a + b.help, 0) });
  }));

  const helpList = [];
  rows.forEach(r => Object.entries(r.items || {}).forEach(([id, v]) => { if (v === "help") helpList.push({ code: r.participant_code, region: r.region, session: r.session, id, note: (r.notes || {})[id] || "", at: r.updated_at }); }));

  $app.innerHTML = `
    <header class="top">
      <div><p class="muted small">${esc(CONFIG.COURSE_NAME)}</p><h1>준비 현황${LIVE ? "" : `<span class="badge">미리보기 데이터</span>`}</h1>
      <p class="lead">등록 참가자 ${participants.length}명. 도움 요청 ${helpList.length}건을 교육 전에 확인해 주세요.</p></div>
      <div class="who"><button class="linkbtn" id="aout">${LIVE ? "로그아웃" : "참가자 화면"}</button></div>
    </header>
    <section class="sheet" style="border-radius:14px">
      <h2>회기별 준비율</h2>
      <div class="scroll" style="margin-top:12px"><table>
        <thead><tr><th>지역</th><th>회기</th><th>응답/등록</th><th>평균 준비율</th><th>준비 완료</th><th>도움 요청</th></tr></thead>
        <tbody>${stats.map(x => `<tr><td>${regionName(x.reg)}</td><td>${x.s.id}회기 ${esc(x.s.short)}</td><td>${x.answered} / ${x.total}</td>
          <td>${x.avg == null ? "-" : x.avg + "%"}</td><td>${x.full}명</td><td style="${x.help ? "color:var(--stamp);font-weight:700" : ""}">${x.help}건</td></tr>`).join("")}</tbody>
      </table></div>

      ${SESSIONS.map(s => {
        const hs = helpList.filter(h => h.session === s.id);
        const byItem = s.items.map(it => {
          const vals = rows.filter(r => r.session === s.id).map(r => (r.items || {})[it.id]).filter(v => v && v !== "na");
          return { it, pct: vals.length ? Math.round(vals.filter(v => v === "done").length / vals.length * 100) : null };
        }).filter(x => x.pct != null).sort((a, b) => a.pct - b.pct).slice(0, 3);
        const answered = new Set(rows.filter(r => r.session === s.id && Object.keys(r.items || {}).length).map(r => r.participant_code));
        const missing = participants.filter(p => !answered.has(p.code));
        const qs = rows.filter(r => r.session === s.id && r.question);
        return `<div class="adminsec" style="--acc:var(${s.color})">
          <h3 style="border-left:4px solid var(--acc);padding-left:10px">${s.id}회기 ${esc(s.title)}</h3>
          <p class="small muted" style="margin-top:12px">도움 요청 ${hs.length}건, 많은 항목부터</p>
          ${s.items.map(it => ({ it, list: hs.filter(h => h.id === it.id) })).filter(g => g.list.length).sort((a, b) => b.list.length - a.list.length).map(g => `
            <div class="req"><b>${g.list.length}명</b> ${esc(g.it.text)}
              ${g.list.filter(h => h.note).map(h => `<div style="margin-top:4px">“${esc(h.note)}” <span class="meta">${esc(h.code)}</span></div>`).join("")}
              <div class="codes" style="margin-top:6px">${g.list.map(h => `<span>${esc(h.code)}</span>`).join("")}</div></div>`).join("") || `<p class="small">요청이 없습니다.</p>`}
          ${byItem.length ? `<p class="small muted" style="margin-top:16px">완료율이 낮은 항목</p><ol class="small">${byItem.map(x => `<li>${esc(x.it.text)} <b>${x.pct}%</b></li>`).join("")}</ol>` : ""}
          ${qs.length ? `<p class="small muted" style="margin-top:16px">사전 질문</p>${qs.map(r => `<div class="req" style="border-color:var(--acc)">${esc(r.question)}<div class="meta">${esc(r.participant_code)}</div></div>`).join("")}` : ""}
          <p class="small muted" style="margin-top:16px">아직 열어 보지 않은 참가자 ${missing.length}명</p>
          <div class="codes">${missing.map(p => `<span>${esc(p.code)}</span>`).join("") || "모두 응답했습니다."}</div>
        </div>`;
      }).join("")}

      <div class="actions">
        <button class="btn" id="csvHelp">도움 요청 CSV</button>
        <button class="btn ghost" id="csvMiss">미응답자 CSV</button>
        <button class="btn ghost" id="csvRaw">전체 현황 CSV</button>
      </div>
      <p class="small muted" style="margin-top:10px">CSV의 참가 코드를 운영 명단과 맞추면 연락 대상과 재안내 문자 발송 명단이 됩니다.</p>
    </section>`;

  document.getElementById("aout").onclick = async () => { await api.adminLogout(); location.hash = ""; };
  const dl = (name, lines) => {
    const blob = new Blob(["\uFEFF" + lines.map(l => l.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast("CSV 파일을 내려받았습니다.");
  };
  document.getElementById("csvHelp").onclick = () => dl("준비점검_도움요청.csv",
    [["참가코드", "지역", "회기", "항목ID", "항목", "요청 내용", "마지막 수정"], ...helpList.map(h => [h.code, regionName(h.region), h.session, h.id, findItem(h.id).text, h.note, h.at])]);
  document.getElementById("csvMiss").onclick = () => {
    const lines = [["참가코드", "지역", "회기"]];
    SESSIONS.forEach(s => { const a = new Set(rows.filter(r => r.session === s.id && Object.keys(r.items || {}).length).map(r => r.participant_code)); participants.filter(p => !a.has(p.code)).forEach(p => lines.push([p.code, regionName(p.region), s.id])); });
    dl("준비점검_미응답자.csv", lines);
  };
  document.getElementById("csvRaw").onclick = () => {
    const ids = allItems.map(i => i.id);
    const label = v => (STATUS.find(o => o.v === v) || {}).label || "";
    dl("준비점검_전체현황.csv", [["참가코드", "지역", "회기", "준비율", ...ids, "사전 질문"],
      ...rows.map(r => { const s = SESSIONS[r.session - 1]; return [r.participant_code, regionName(r.region), r.session, readiness(s, r.items || {}).pct + "%", ...ids.map(id => id.startsWith(r.session + "-") ? label((r.items || {})[id]) : ""), r.question]; })]);
  };
}

/* =========================================================
   7. 시작
   ========================================================= */
async function route() {
  if (location.hash === "#admin") return renderAdmin();
  const q = new URLSearchParams(location.search).get("code");
  for (const c of [q, store.get("prepcheck-code", null)]) {
    if (!c) continue;
    try { const u = await api.checkCode(c); if (u) return enter(u); } catch (e) { console.error(e); }
  }
  renderLogin();
}
window.addEventListener("hashchange", route);
route();
</script>
